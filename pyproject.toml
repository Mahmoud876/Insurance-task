[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "0.1.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "pytest>=8",
  "pre-commit>=4",
  "import-linter>=2.0",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["api/tests"]

[tool.importlinter]
root_packages = ["api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Prevent api core from importing test code"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["tests", "api.tests"]