[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9.12",
  "psycopg[binary]>=3.3.4",
  "python-dotenv>=1.2.2",
  "hypothesis>=6.165.10",
  "faker>=37.0.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pydantic-settings>=2.15.0",
  "pyjwt>=2.10.0",
  "mypy-baseline>=0.7.4",
  "types-pyjwt>=1.7.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "pytest>=8",
  "pre-commit>=4",
  "import-linter>=2.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "mypy-baseline>=0.7.0",
  "pytest>=8",
  "pre-commit>=4",
  "import-linter>=2.0",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]
plugins = [
  "pydantic.mypy"
]
exclude = '(?i)(\.?venv|build|dist|alembic[/\\]versions)'

ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "pydantic_settings.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.config"
disallow_subclassing_any = false

[tool.pytest.ini_options]
  testpaths = ["tests"]
  pythonpath = ["."]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Prevent app core from importing test code"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["tests"]

[tool.setuptools.packages.find]
where = ["."]

[[tool.mypy.overrides]]
module = ["dotenv", "dotenv.*"]
ignore_missing_imports = true
